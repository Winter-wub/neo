<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>โมจิ — face mock</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:sans-serif}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;padding:8px;justify-content:center}
button{background:#123;color:#7fffd4;border:1px solid #7fffd4;padding:6px 10px;border-radius:4px;font-size:14px}
#st{position:fixed;top:6px;left:8px;color:#7fffd4;font-size:13px}
</style></head><body>
<canvas id="c" width="32" height="18"></canvas>
<div id="st"></div>
<div id="ui"></div>
<script>
const W=32,H=18,cv=document.getElementById('c'),g=cv.getContext('2d');
const FG='#7fffd4',HT='#ff7aa8',CK='#ff9a9a';
let state='idle',force=null,frame=0,blinkAt=40,blinkT=0,lookX=0,lookAt=60,pleasure=0,lastStroke=0,talkT=0,hearts=[];
// ตา: ถ้า shape ตามชื่อ (วาดด้วยพิกเซลล้วน)
function px(x,y,c){g.fillStyle=c||FG;g.fillRect(x,y,1,1)}
function rect(x,y,w,h,c){g.fillStyle=c||FG;g.fillRect(x,y,w,h)}
function eye(cx,kind,dx){
  const x=cx-3+dx,y=4;
  if(kind==='open'){rect(x,y,6,8);rect(x+1,y+1,1,1,'#000')}
  else if(kind==='big'){rect(x-1,y-1,8,10);px(x+1,y+1,'#000');px(x+2,y+1,'#000')}
  else if(kind==='blink'){rect(x,y+4,6,1)}
  else if(kind==='happy'){px(x,y+5);px(x+1,y+4);px(x+2,y+3);px(x+3,y+3);px(x+4,y+4);px(x+5,y+5)} // ^
  else if(kind==='close'){px(x,y+3);px(x+1,y+4);px(x+2,y+5);px(x+3,y+5);px(x+4,y+4);px(x+5,y+3)} // ‿ ตาหลับโค้ง
  else if(kind==='up'){rect(x,y,6,7);rect(x+2,y,2,2,'#000')}
  else if(kind==='sleepy'){rect(x,y+3,6,5);rect(x,y+3,6,2,'#000');rect(x,y+5,6,1)}
}
function mouth(kind){
  const cx=16,y=14;
  if(kind==='line'){rect(cx-3,y,6,1);px(cx-4,y-1);px(cx+3,y-1)}
  else if(kind==='o'){rect(cx-1,y-1,3,3)}
  else if(kind==='smile'){rect(cx-3,y,6,1);px(cx-4,y-1);px(cx+3,y-1);rect(cx-2,y+1,4,1)}
  else if(kind==='big'){rect(cx-4,y-1,8,1);rect(cx-3,y,6,2);rect(cx-2,y+2,4,0)}
  else if(kind==='tiny'){rect(cx-2,y,4,1);px(cx-3,y-1);px(cx+2,y-1)}
  else if(kind==='wave'){px(cx-3,y);px(cx-2,y-1);px(cx-1,y);px(cx,y-1);px(cx+1,y);px(cx+2,y-1)}
  else if(kind==='talk0'){rect(cx-3,y,6,1)}
  else if(kind==='talk1'){rect(cx-3,y-1,6,3)}
  else if(kind==='talk2'){rect(cx-4,y-1,8,4)}
  else if(kind==='yawn'){rect(cx-2,y-1,4,4)}
}
function heart(x,y,c){[[1,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[1,2],[2,2],[3,2],[2,3]].forEach(p=>px(x+p[0],y+p[1],c))}
function pick(){
  if(force) return force;
  if(pleasure>0.15) return 'bliss';
  return state;
}
function draw(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  let s=pick(),e='open',m='line',dx=0;
  if(s==='idle'){dx=lookX;m='line';if(blinkT>0)e='blink'}
  else if(s==='blink'){e='blink'}
  else if(s==='listen'){e='big';m='o'}
  else if(s==='think'){e='up';m='wave'}
  else if(s==='talk'){m=['talk0','talk1','talk2','talk1'][(frame>>1)&3];if(blinkT>0)e='blink'}
  else if(s==='happy'){e='happy';m='big'}
  else if(s==='sleepy'){e='sleepy';m=(frame>>4)&1?'yawn':'tiny'}
  else if(s==='bliss'){e=pleasure>0.5?'close':'happy';m='tiny'}
  eye(9,e,dx);eye(23,e,dx);mouth(m);
  if(s==='bliss'&&pleasure>0.5){rect(4,11,3,1,CK);rect(25,11,3,1,CK)}
  hearts.forEach(h=>heart(h.x|0,h.y|0,HT));
  document.getElementById('st').textContent='state: '+s+'  เคลิ้ม: '+pleasure.toFixed(2);
}
function tick(){
  frame++;
  if(frame>=blinkAt){blinkT=2;blinkAt=frame+30+Math.random()*50|0}
  if(blinkT>0)blinkT--;
  if(frame>=lookAt){lookX=[-1,0,1][Math.random()*3|0];lookAt=frame+40+Math.random()*60|0}
  pleasure=Math.max(0,pleasure-0.012); // ลดเองเมื่อหยุดลูบ
  if(pick()==='bliss'&&frame%14===0&&hearts.length<3)hearts.push({x:12+Math.random()*8,y:3});
  hearts.forEach(h=>h.y-=0.12);hearts=hearts.filter(h=>h.y>-4);
  draw();
}
setInterval(tick,100); // 10 fps
// ตรวจจับการลูบ: ลากช้า-กลาง ต่อเนื่อง สะสมระยะ
let last=null;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
cv.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointermove',e=>{
  if(!last)return;
  const now=performance.now(),p={x:e.clientX,y:e.clientY,t:now},dt=(now-last.t)/1000||0.016,d=dist(p,last),v=d/dt;
  if(v>20&&v<500)pleasure=Math.min(1,pleasure+d/600); // เร็วเกิน (flick) ไม่นับ
  last=p;
});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,()=>{last=null}));
// ปุ่มดู state
const ui=document.getElementById('ui');
['auto','idle','blink','listen','think','talk','happy','sleepy','bliss'].forEach(n=>{
  const b=document.createElement('button');b.textContent=n==='bliss'?'เคลิ้ม':n;
  b.onclick=()=>{force=n==='auto'?null:n;if(n==='bliss'){force=null;pleasure=1}};
  ui.appendChild(b);
});
function fit(){}
</script></body></html>
